[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ninjadesc"
version = "1.0.0"
description = "Content-Concealing Visual Descriptors via Adversarial Learning (CVPR 2022)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "CC-BY-NC-4.0" }
authors = [
    { name = "Tony Ng" },
    { name = "Hyo Jin Kim" },
    { name = "Vincent T. Lee" },
    { name = "Daniel DeTone" },
    { name = "Tsun-Yi Yang" },
    { name = "Tianwei Shen" },
    { name = "Eddy Ilg" },
    { name = "Vassileios Balntas" },
    { name = "Krystian Mikolajczyk" },
    { name = "Chris Sweeney" },
]
keywords = [
    "computer vision",
    "local features",
    "descriptors",
    "privacy",
    "adversarial learning",
]
dependencies = [
    "torch>=1.10",
    "torchvision>=0.11",
    "pytorch-lightning>=1.5,<2",
    "hydra-core>=1.1",
    "hydra-colorlog>=1.1",
    "omegaconf>=2.1",
    "kornia>=0.6",
    "scikit-image>=0.18",
    "opencv-python>=4.5",
    "numpy>=1.20",
    "h5py>=3.1",
    "tqdm>=4.60",
    "matplotlib>=3.4",
]

[tool.setuptools.packages.find]
include = ["ninjadesc*"]

[tool.setuptools.package-data]
"ninjadesc.pa_desc.config" = ["**/*.yaml"]
