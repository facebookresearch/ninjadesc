# @package _group_

# Seed for training
seed: 42

# Patch size for descriptor computation
patch_size: 32

# Base descriptor type, e.g. SIFT, Hardet, SOSNet (default: sosnet)
base_desc: sosnet

# run_name is used to find the related checkpoint if restarting is set true.
# ASSIGN A UNIQUE RUN_NAME FROM EACH RUN
run_name : null

# Checkpoint path
checkpoint_path: null

# Pretrained PADesc post recon training
pretrained_dir: null

# Testing Options (if neither then tests uninitialised model)
test:
  # Path to checkpoint to test
  checkpoint: ''
  # Path to torchscript model to test
  torchscript: ''

defaults:
  # Hydra
  - _self_
  - hydra/job_logging: colorlog
  - hydra/hydra_logging: colorlog
  # Train Data (dataloader, transforms, dataset)
  # By setting ds to null we can override with any dataset at runtime, i.e.: `datasets@data.train.ds=liberty`
  - dataloader@data.train.dl.patch: patch # dataloader for patches
  - transforms@data.train.tfs: training # transforms for patches
  - dataloader@data.train.dl.recon: recon # # dataloader for recon
  - datasets@data.train.ds: liberty
  # Test Data (list of datasets, naming a/b/c ignored)
  - dataloader@data.test.dl: default
  - transforms@data.test.tfs: default
  - datasets@data.test.ds.a: yosemite
  - datasets@data.test.ds.b: notredame
  - datasets@data.test.ds.c: liberty
  # Training
  - model: joint
  - loss: joint
  - trainer: default
  - optimizer@optim.optimizer: joint
  - optim.scheduler: null
  - early_stopping: default
  - results: default
  # Other
  - profiler: null
  - callbacks: null
  - logger: tensorboard
  - checkpoint_callback: joint
  - system: null
