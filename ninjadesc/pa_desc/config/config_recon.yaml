# @package _group_

# Seed for training
seed: 42

# Patch size for descriptor computation
patch_size: 32

# Base descriptor type, e.g. SIFT, Hardet, SOSNet (default: sosnet)
base_desc: sosnet

# Checkpoint path
checkpoint_path: null

# Use different architecture (UResNet) or not
uresnet: false

uresnet_architecture: resnet50

# test mode or no
is_test: false

# Test PADesc path. Set base_dir to a local checkpoint directory; the trainer
# will assemble the final filename as
#   ${base_dir}/checkpoints/epoch=${epoch}-step=${step}.ckpt
padesc_checkpoint:
  base_dir: ${oc.env:NINJADESC_OUTPUT_ROOT,./outputs}/pa_desc_joint
  epoch: 21
  step: 13749
  is_base: false # set true to evaluate on original base descriptors (e.g. sos, sift, hardnet)
  original: false # set true to evaluate on original padesc descriptors
  pretrained_unet: true

# Testing Options (if neither then tests uninitialised model)
test:
  # Path to checkpoint to test
  checkpoint: ''
  # Path to torchscript model to test
  torchscript: ''

defaults:
  # Hydra
  - _self_
  - hydra/job_logging: colorlog
  - hydra/hydra_logging: colorlog
  # Train Data (dataloader, transforms, dataset)
  # By setting ds to null we can override with any dataset at runtime, i.e.: `datasets@data.train.ds=liberty`
  - dataloader@data.train.dl: recon
  - transforms@data.train.tfs: training
  - datasets@data.train.ds: null
  # Test Data (list of datasets, naming a/b/c ignored)
  - dataloader@data.test.dl: recon
  - transforms@data.test.tfs: default
  - datasets@data.test.ds.a: yosemite
  - datasets@data.test.ds.b: notredame
  - datasets@data.test.ds.c: liberty
  # Training
  - model: unet
  - loss: recon
  - trainer: default
  - optimizer@optim.optimizer: adam
  - optim.scheduler: null
  - early_stopping: default
  - results: default
  # Other
  - profiler: null
  - callbacks: null
  - logger: tensorboard
  - checkpoint_callback: recon
  - system: null
